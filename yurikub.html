<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rummikub Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f44, #1a3c7a);
            color: white;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on mobile */
        }
        
        .font-game {
            font-family: 'Fredoka One', cursive;
        }

        /* Lobby Styles */
        .avatar-option {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .avatar-option:hover {
            transform: scale(1.1);
        }
        .avatar-option.selected {
            border: 3px solid #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
            transform: scale(1.1);
        }

        /* Game Board Styles */
        #game-container {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .board-area {
            background: radial-gradient(circle at center, #1e4b96 0%, #0d2859 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .tile {
            width: 40px;
            height: 56px;
            background: linear-gradient(to bottom, #ffffff, #f0f0f0);
            border-radius: 4px;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            padding-top: 4px;
            cursor: grab;
            user-select: none;
            position: absolute; /* For dragging */
            z-index: 10;
            transition: transform 0.1s;
        }
        .tile:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 100;
        }
        
        .tile.selected {
             box-shadow: 0 0 10px #fbbf24, 1px 2px 4px rgba(0,0,0,0.3);
             transform: translateY(-5px);
        }

        .tile-number {
            font-family: 'Arial', sans-serif;
            line-height: 1;
        }
        
        /* Smaller font for 2-digit numbers */
        .tile-number.double-digit {
            font-size: 20px;
            margin-top: 2px;
        }

        /* Colors matching the reference image */
        .color-black { color: #000000; }
        .color-blue { color: #1d4ed8; }
        .color-orange { color: #f97316; }
        .color-red { color: #dc2626; }

        .joker {
            font-size: 28px;
            line-height: 1;
            margin-top: 6px;
        }

        .player-rack {
            background: linear-gradient(to bottom, #d4a373, #a98467);
            border-top: 2px solid #e6ccb2;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            padding: 10px;
            position: relative;
        }

        /* Player Profile Styles (Left side) */
        .player-profile {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            padding: 4px;
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .player-profile img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4a5568;
        }
        .player-profile.active {
            box-shadow: 0 0 15px #4ade80;
        }
        .player-profile.active img {
            border-color: #4ade80;
        }
        
        .timer-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 4px solid transparent;
            /* Animation added in JS */
        }
        
        .timer-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            color: white;
            text-shadow: 1px 1px 2px black;
            z-index: 5;
            display: none;
        }
        
        .player-profile.active .timer-text {
            display: block;
        }

        /* UI Buttons */
        .game-btn {
            background: linear-gradient(to bottom, #3b82f6, #1e3a8a);
            border: 1px solid #60a5fa;
            border-radius: 20px;
            color: white;
            padding: 8px 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, filter 0.1s;
        }
        .game-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .game-btn:hover {
            filter: brightness(1.2);
        }
        
        .draw-btn {
            background: linear-gradient(to bottom, #475569, #1e293b);
            border-color: #94a3b8;
            height: 100px;
            width: 60px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .done-btn {
            background: linear-gradient(to bottom, #10b981, #047857);
            border-color: #34d399;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .sort-btn {
            background: linear-gradient(to bottom, #3b82f6, #1e3a8a);
            border: 1px solid #60a5fa;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-size: 18px;
            cursor: pointer;
        }
        .sort-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.3);
        }

        /* End Turn & Action Buttons */
        .done-btn {
            background: linear-gradient(to bottom, #10b981, #047857);
            border: 2px solid #34d399;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .done-btn:hover {
            transform: scale(1.06);
            filter: brightness(1.15);
        }
        .done-btn:active {
            transform: scale(0.96);
        }

        /* Toast notification */
        #game-toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #eab308;
            color: #fef08a;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #game-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Chat Styles - 화면 좌측 하단 고정 */
        #chat-panel {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(8px);
            border: 1px solid #475569;
            border-radius: 16px;
            transition: opacity 0.25s ease, transform 0.25s ease;
            position: fixed;
            left: 20px;
            bottom: 20px;
            height: 360px;
            width: 320px;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
        }
        #chat-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        .message {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .message.mine {
            background: rgba(59, 130, 246, 0.3);
            margin-left: 20px;
        }
        
        /* Modal Styles */
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }
        
        /* Drop zone indicator */
        .drop-zone-highlight {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = 'rummi'
        const firebaseConfig = {
          apiKey: "AIzaSyAErVMUePGOBVS4EWpLuUbUiivb9ZbSdYc",
          authDomain: "norummikub.firebaseapp.com",
          projectId: "norummikub",
          storageBucket: "norummikub.firebasestorage.app",
          messagingSenderId: "211723475103",
          appId: "1:211723475103:web:793bb0e7a6ca099a8eeaaa"
        };
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Could not parse firebase config, using mock logic.");
        }

        // State variables
        let app, db, auth;
        let currentUser = null;
        let currentRoomId = null;
        let unsubscribeRoom = null;
        let unsubscribeChat = null;
        
        // Game State
        const gameState = {
            players: {}, // uid -> {name, avatar, tileCount, isTurn, rack: []}
            spectators: {}, // uid -> {name}
            board: [],   // Array of tile objects on the board
            pool: [],    // Tiles left to draw
            turnTimer: 30,
            turnStartTime: 0,
            currentPlayerId: null,
            status: 'lobby', // lobby, playing, finished
            host: null
        };
        
        // Local state
        let localRack = []; // Tiles currently on player's rack
        let isSpectator = false;
        let draggedTile = null;
        let initialRackState = []; // For resetting turn
        let initialBoardState = []; // For resetting turn
        let hasDrawn = false;
        let turnStartingRackCount = 0;

        // Constants
        const TILE_COLORS = ['black', 'blue', 'orange', 'red'];
        const AVATAR_COUNT = 20;

        function unpackBoard(boardData) {
            if (!boardData) return [];
            if (typeof boardData === 'string') {
                try {
                    return JSON.parse(boardData);
                } catch (e) {
                    console.error("Error parsing board data:", e);
                    return [];
                }
            }
            if (Array.isArray(boardData)) return boardData;
            return [];
        }

        function checkBoardValidity() {
            return validateEntireBoard();
        }

        const els = {
            authScreen: document.getElementById('auth-screen'),
            lobbyScreen: document.getElementById('lobby-screen'),
            gameContainer: document.getElementById('game-container'),
            roomList: document.getElementById('room-list'),
            createRoomBtn: document.getElementById('create-room-btn'),
            createRoomModal: document.getElementById('create-room-modal'),
            playerNameInput: document.getElementById('player-name'),
            avatarGrid: document.getElementById('avatar-grid'),
            
            // Game UI
            boardArea: document.getElementById('board-area'),
            rackArea: document.getElementById('rack-area'),
            playersSidebar: document.getElementById('players-sidebar'),
            poolCountText: document.getElementById('pool-count'),
            drawBtn: document.getElementById('draw-btn'),
            doneBtn: document.getElementById('done-btn'),
            resetBtn: document.getElementById('reset-btn'),
            rackDoneBtn: document.getElementById('rack-done-btn'),
            gameToast: document.getElementById('game-toast'),
            leaveBtn: document.getElementById('leave-btn'),
            sort789Btn: document.getElementById('sort-789-btn'),
            sort777Btn: document.getElementById('sort-777-btn'),
            
            // Chat UI
            chatBtn: document.getElementById('chat-btn'),
            chatQuickBtn: document.getElementById('chat-quick-btn'),
            chatPanel: document.getElementById('chat-panel'),
            chatMessages: document.getElementById('chat-messages'),
            chatInput: document.getElementById('chat-input'),
            sendChatBtn: document.getElementById('send-chat-btn'),
            
            // Status
            statusMsg: document.getElementById('status-msg'),
            startGameBtn: document.getElementById('start-game-btn')
        };

        let selectedAvatarIndex = 1;
        let selectedTimer = 30;

        function showScreen(screenId) {
            const screens = ['auth-screen', 'lobby-screen', 'game-container'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if (id === screenId) {
                    el.style.display = 'flex';
                    el.classList.remove('hidden');
                } else {
                    el.style.display = 'none';
                    el.classList.add('hidden');
                }
            });
        }

        // Generate mock avatars
        function generateAvatars() {
            els.avatarGrid.innerHTML = '';
            for (let i = 1; i <= AVATAR_COUNT; i++) {
                const bgColors = ['bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-red-500', 'bg-purple-500'];
                const bgColor = bgColors[i % bgColors.length];
                // Using placeholder images for avatars to ensure variety
                const imgUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=rummi${i}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffdfbf,ffd5dc`;
                
                const div = document.createElement('div');
                div.className = `avatar-option w-16 h-16 rounded-full overflow-hidden border-2 border-gray-600 ${i === selectedAvatarIndex ? 'selected' : ''}`;
                div.innerHTML = `<img src="${imgUrl}" alt="Avatar ${i}" class="w-full h-full object-cover">`;
                div.onclick = () => {
                    document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedAvatarIndex = i;
                };
                els.avatarGrid.appendChild(div);
            }
        }

        // Initialize App
        async function init() {
            generateAvatars();
            
            // Default name
            els.playerNameInput.value = "Player_" + Math.floor(Math.random() * 1000);

            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                try {
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            currentUser = user;
                            showLobby();
                            loadRooms();
                        }
                    });
                } catch (error) {
                    console.error("Auth error:", error);
                    showError("Authentication failed.");
                    initMockMode(); // Fallback
                }
            } else {
                initMockMode();
            }
            
            setupEventListeners();
        }

        function initMockMode() {
            console.log("Running in mock mode (no Firebase)");
            currentUser = { uid: 'mock_user_' + Date.now() };
            showLobby();
            
            els.roomList.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-5 border border-slate-700 flex flex-col justify-between hover:border-blue-500 transition-colors">
                    <div>
                        <h3 class="font-bold text-lg text-white mb-1">Local Practice Room</h3>
                        <p class="text-sm text-gray-400">Host: Practice AI</p>
                        <p class="text-sm text-gray-400">Timer: 30s</p>
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-blue-400 font-bold text-sm">1/4 Players</span>
                        <button id="quick-play-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-bold text-sm">Play Now</button>
                    </div>
                </div>
            `;
            
            const quickBtn = document.getElementById('quick-play-btn');
            if (quickBtn) {
                quickBtn.onclick = () => startMockGame();
            }
        }

        function startMockGame() {
            currentRoomId = 'local_room_' + Date.now();
            gameState.host = currentUser.uid;
            gameState.turnTimer = selectedTimer || 30;
            gameState.players = {};
            gameState.players[currentUser.uid] = getPlayerInitialState();
            gameState.players['bot_1'] = {
                name: "AI Bot 1",
                avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=rummiBot1&backgroundColor=ffdfbf",
                tileCount: 14,
                rack: [],
                score: 0
            };
            gameState.pool = createTilePool();
            joinRoom(currentRoomId, "Local Game", true);
        }

        function showToast(message, isError = false) {
            if (!els.gameToast) return;
            els.gameToast.textContent = message;
            els.gameToast.style.borderColor = isError ? '#ef4444' : '#10b981';
            els.gameToast.style.color = isError ? '#fca5a5' : '#86efac';
            els.gameToast.classList.add('show');
            setTimeout(() => {
                els.gameToast.classList.remove('show');
            }, 2500);
        }

        function showLobby() {
            showScreen('lobby-screen');
        }
        
        function showError(msg) {
            showToast(msg, true);
        }

        function getRoomsRef() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
        }
        
        function getRoomRef(roomId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
        }
        
        function getChatRef(roomId) {
            return collection(db, 'artifacts', appId, 'public', 'data', 'chats', roomId, 'messages');
        }

        function loadRooms() {
            if (!db) return;
            
            const roomsRef = getRoomsRef();
            // In real app, we'd use onSnapshot, but keeping it simple as per instructions (no complex queries)
            // We'll poll or refresh manually for simplicity if onSnapshot on collection without where is allowed
            onSnapshot(roomsRef, (snapshot) => {
                els.roomList.innerHTML = '';
                if (snapshot.empty) {
                    els.roomList.innerHTML = '<p class="text-gray-400 text-center col-span-full">No active rooms. Create one!</p>';
                    return;
                }
                
                snapshot.forEach(doc => {
                    const room = doc.data();
                    if (room.status === 'lobby' || room.status === 'playing') {
                        const playerCount = Object.keys(room.players || {}).length;
                        renderRoomCard(doc.id, room, playerCount);
                    }
                });
            }, (error) => {
                console.error("Error loading rooms:", error);
            });
        }

        function renderRoomCard(roomId, room, playerCount) {
            const div = document.createElement('div');
            div.className = 'bg-slate-800 rounded-lg p-4 flex flex-col justify-between border border-slate-700 hover:border-blue-500 transition-colors cursor-pointer';
            
            let timerText = room.turnTimer === 0 ? "Unlimited" : `${room.turnTimer}s`;
            
            const isFull = playerCount >= 4;
            const isInRoom = room.players && currentUser && room.players[currentUser.uid];
            let btnText = "Join";
            let btnClass = "bg-blue-600 hover:bg-blue-500";
            
            if (isInRoom) {
                btnText = "Rejoin";
            } else if (isFull) {
                btnText = "Spectate";
                btnClass = "bg-purple-600 hover:bg-purple-500";
            }
            
            div.innerHTML = `
                <div>
                    <h3 class="font-bold text-lg mb-1">${room.name}</h3>
                    <p class="text-sm text-gray-400">Host: ${room.hostName || 'Unknown'}</p>
                    <p class="text-sm text-gray-400">Timer: ${timerText}</p>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <span class="text-blue-400 font-bold">${playerCount}/4 Players</span>
                    <button class="${btnClass} text-white px-4 py-2 rounded font-bold text-sm">${btnText}</button>
                </div>
            `;
            
            div.onclick = () => joinRoom(roomId, room.name);
            els.roomList.appendChild(div);
        }

        async function createRoom(e) {
            e.preventDefault();
            const roomName = document.getElementById('room-name').value || `${els.playerNameInput.value}'s Game`;
            const timer = parseInt(document.getElementById('timer-select').value);
            
            els.createRoomModal.classList.add('hidden');
            els.createRoomModal.classList.remove('flex');

            if (!db) {
                selectedTimer = timer;
                startMockGame();
                return;
            }

            try {
                const roomData = {
                    name: roomName,
                    host: currentUser.uid,
                    hostName: els.playerNameInput.value,
                    turnTimer: timer,
                    status: 'lobby',
                    players: {},
                    spectators: {},
                    board: JSON.stringify([]),
                    pool: createTilePool(),
                    currentPlayerId: currentUser.uid,
                    turnStartTime: Date.now(),
                    lastUpdate: Date.now()
                };
                
                // Add host to players
                roomData.players[currentUser.uid] = getPlayerInitialState();

                const docRef = await addDoc(getRoomsRef(), roomData);
                await joinRoom(docRef.id, roomName);
            } catch (error) {
                console.error("Error creating room, falling back to local mode:", error);
                selectedTimer = timer;
                startMockGame();
            }
        }

        function setupGameUI() {
            // Initial setup for the board and rack areas
            els.boardArea.innerHTML = `
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-5">
                     <h1 class="text-8xl font-game text-white">Rummikub</h1>
                </div>
            `;
            els.rackArea.innerHTML = '';
            els.playersSidebar.innerHTML = '';
            updatePoolCount();
        }

        async function joinRoom(roomId, roomName, isMock = false) {
            currentRoomId = roomId;
            showScreen('game-container');
            setupGameUI();
            
            if (isMock) {
                // Mock setup
                gameState.players[currentUser.uid] = getPlayerInitialState();
                gameState.pool = createTilePool();
                // Start a mock game automatically for testing
                startGame([currentUser.uid, 'bot_1']);
                return;
            }

            try {
                const roomRef = getRoomRef(roomId);
                const roomSnap = await getDoc(roomRef);
                
                if (roomSnap.exists()) {
                    const data = roomSnap.data();
                    const playerCount = Object.keys(data.players || {}).length;
                    isSpectator = false;
                    
                    // Add user if not in room
                    if (data.players && data.players[currentUser.uid]) {
                        // Already a player, proceed normally
                    } else if (playerCount < 4) {
                        // Join as player
                        const playerData = getPlayerInitialState();
                        await updateDoc(roomRef, {
                            [`players.${currentUser.uid}`]: playerData
                        });
                    } else {
                        // Join as spectator
                        isSpectator = true;
                        await updateDoc(roomRef, {
                            [`spectators.${currentUser.uid}`]: { name: els.playerNameInput.value || "Spectator" }
                        });
                    }
                    
                    // Subscribe to room changes
                    unsubscribeRoom = onSnapshot(roomRef, (doc) => {
                        if (doc.exists()) {
                            syncGameState(doc.data());
                        } else {
                            handleRoomClosed();
                        }
                    }, (error) => {
                        console.error("Room sync error:", error);
                    });
                    
                    // Setup Chat
                    setupChatSync(roomId);
                    
                } else {
                    showError("Room not found");
                    showLobby();
                }
            } catch (error) {
                console.error("Error joining room:", error);
                showError("Failed to join room.");
                showLobby();
            }
        }

        function getPlayerInitialState() {
            const name = els.playerNameInput.value || "Player";
            const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=rummi${selectedAvatarIndex}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffdfbf,ffd5dc`;
            
            return {
                name: name,
                avatar: avatarUrl,
                tileCount: 0,
                rack: [],
                score: 0
            };
        }

        function createTilePool() {
            const pool = [];
            let idCounter = 0;
            // 2 sets of numbers 1-13 in 4 colors
            for (let set = 0; set < 2; set++) {
                for (const color of TILE_COLORS) {
                    for (let num = 1; num <= 13; num++) {
                        pool.push({ id: `t_${idCounter++}`, number: num, color: color, isJoker: false });
                    }
                }
            }
            // 2 Jokers (usually red/black face, but logically identical here initially)
            pool.push({ id: `t_${idCounter++}`, number: null, color: 'joker-red', isJoker: true });
            pool.push({ id: `t_${idCounter++}`, number: null, color: 'joker-black', isJoker: true });
            
            // Shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return pool;
        }

        function dealInitialTiles(uid) {
            const rack = [];
            for (let i = 0; i < 14; i++) {
                if (gameState.pool.length > 0) {
                    rack.push(gameState.pool.pop());
                }
            }
            gameState.players[uid].rack = rack;
            gameState.players[uid].tileCount = rack.length;
            localRack = [...rack];
        }

        function syncGameState(data) {
            // Update local game state
            const prevPlayerId = gameState.currentPlayerId;
            const rawBoard = data.board;
            Object.assign(gameState, data);

            // Deserialize board from string if synced from Firestore
            if (rawBoard !== undefined) {
                gameState.board = unpackBoard(rawBoard);
            }
            
            const addBotBtn = document.getElementById('add-bot-btn');
            // Host UI logic: Show Start Game button if in lobby
            if (gameState.status === 'lobby' && gameState.host === currentUser.uid) {
                const playerIds = Object.keys(gameState.players || {});
                if (playerIds.length >= 2) {
                    els.startGameBtn.classList.remove('hidden');
                } else {
                    els.startGameBtn.classList.add('hidden');
                }
                if (addBotBtn && playerIds.length < 4) {
                    addBotBtn.classList.remove('hidden');
                } else if (addBotBtn) {
                    addBotBtn.classList.add('hidden');
                }
            } else {
                els.startGameBtn.classList.add('hidden');
                if (addBotBtn) addBotBtn.classList.add('hidden');
            }
            
            // Sync local rack when turn switches or on first setup
            if (!isSpectator && gameState.players[currentUser.uid]) {
                const serverRack = gameState.players[currentUser.uid].rack || [];
                if (prevPlayerId !== gameState.currentPlayerId) {
                    localRack = [...serverRack];
                    initialRackState = [...serverRack];
                    initialBoardState = JSON.parse(JSON.stringify(gameState.board || []));
                    turnStartingRackCount = localRack.length;
                    hasDrawn = false;
                } else if (!draggedTile && initialRackState.length === 0) {
                    localRack = [...serverRack];
                    turnStartingRackCount = localRack.length;
                }
            }

            updateGameUI();
        }

        async function startGame(playerIds) {
            const updates = {
                status: 'playing',
                currentPlayerId: playerIds[0],
                turnStartTime: Date.now()
            };
            
            // Deal 14 tiles to each player
            playerIds.forEach(uid => {
                const rack = [];
                for (let i = 0; i < 14; i++) {
                    rack.push(gameState.pool.pop());
                }
                updates[`players.${uid}.rack`] = rack;
                updates[`players.${uid}.tileCount`] = 14;
            });
            
            updates.pool = gameState.pool;
            updates.board = JSON.stringify(gameState.board || []);

            if (db && currentRoomId && !currentRoomId.includes('local')) {
                await updateDoc(getRoomRef(currentRoomId), updates);
            } else {
                // Mock update
                Object.assign(gameState, updates);
                gameState.board = unpackBoard(updates.board);
                playerIds.forEach(uid => {
                    gameState.players[uid].rack = updates[`players.${uid}.rack`];
                    gameState.players[uid].tileCount = updates[`players.${uid}.tileCount`];
                    if (uid === currentUser.uid) {
                        localRack = [...updates[`players.${uid}.rack`]];
                        initialRackState = [...localRack];
                        initialBoardState = [];
                        turnStartingRackCount = localRack.length;
                    }
                });
                updateGameUI();
            }
        }

        function updateGameUI() {
            renderSidebar();
            renderBoard();
            renderRack();
            updateControls();
            updatePoolCount();
        }

        function renderSidebar() {
            els.playersSidebar.innerHTML = '';
            
            const uids = Object.keys(gameState.players);
            uids.forEach((uid, index) => {
                const p = gameState.players[uid];
                const isActive = gameState.currentPlayerId === uid;
                
                const div = document.createElement('div');
                div.className = 'flex flex-col items-center mb-6 relative';
                
                let timerHtml = '';
                if (isActive && gameState.turnTimer > 0) {
                    // Calculate remaining time
                    const elapsed = Math.floor((Date.now() - gameState.turnStartTime) / 1000);
                    const remaining = Math.max(0, gameState.turnTimer - elapsed);
                    
                    const progress = remaining / gameState.turnTimer;
                    const color = progress > 0.3 ? '#4ade80' : '#ef4444'; // Green to red
                    
                    timerHtml = `
                        <div class="timer-ring" style="border-top-color: ${color}; border-right-color: ${color}; animation: spin 2s linear infinite;"></div>
                        <div class="timer-text">${remaining}</div>
                    `;
                }

                div.innerHTML = `
                    <div class="player-profile ${isActive ? 'active' : ''}">

                    <div class="text-xs text-gray-300 mt-1 bg-slate-800 px-2 rounded flex items-center gap-1">
                        <i class="fa-solid fa-layer-group text-gray-400"></i> ${p.tileCount || (p.rack ? p.rack.length : 0)}
                    </div>

        // Generate DOM element for a tile
        function createTileElement(tile, x, y, isRack = false) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.id = tile.id;
            
            if (tile.isJoker) {
                const colorClass = tile.color.includes('red') ? 'text-red-500' : 'text-gray-800';
                el.innerHTML = `<div class="joker ${colorClass}"><i class="fa-regular fa-face-smile"></i></div>`;
            } else {
                const colorClass = `color-${tile.color}`;
                const numClass = tile.number > 9 ? 'double-digit' : '';
                el.innerHTML = `<div class="tile-number ${colorClass} ${numClass}">${tile.number}</div>`;
            }

            // Positioning
            if (x != null && y != null) {
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                el.style.position = 'absolute';
            } else {
                el.style.position = 'relative'; // For flex layout in rack
                el.style.left = 'auto';
                el.style.top = 'auto';
            }

            // Interactivity
            if (isRack || gameState.currentPlayerId === currentUser.uid) {
                makeDraggable(el, tile, isRack);
            }

            return el;
        }

        function renderBoard() {
            // Keep existing dragged tile to avoid interruption
            const draggedId = draggedTile ? draggedTile.dataset.id : null;
            
            els.boardArea.innerHTML = '';
            
            // For this simple implementation, we assume board is an array of tile groups
            // In a full implementation, board state would store exact X,Y coords
            // Here, we'll render them in rows for simplicity, or rely on absolute coords if stored
            
            gameState.board.forEach((group, gIdx) => {
                const groupDiv = document.createElement('div');
                // 그룹 전체를 드롭 타겟으로 설정하여 놓기 쉽게 변경
                groupDiv.className = 'flex gap-1 absolute bg-black/20 p-2 rounded transition-colors';
                const top = 50 + (gIdx * 70);
                const left = 50 + ((gIdx % 3) * 150);
                groupDiv.style.top = `${top}px`;
                groupDiv.style.left = `${left}px`;
                groupDiv.dataset.groupId = gIdx;
                groupDiv.dataset.dropTarget = 'group';

                group.forEach(tile => {
                     if (tile.id !== draggedId) {
                         const tEl = createTileElement(tile);
                         tEl.style.position = 'relative'; // Override absolute for group layout
                         groupDiv.appendChild(tEl);
                     }
                });

                els.boardArea.appendChild(groupDiv);
            });
            
            // Make board itself a drop target for new groups
            els.boardArea.dataset.dropTarget = 'board';
        }

        function renderRack() {
            els.rackArea.innerHTML = '';
            // Two rows logic
            const row1 = document.createElement('div');
            const row2 = document.createElement('div');
            row1.className = 'flex flex-wrap gap-1 justify-center mb-1 min-h-[64px] min-w-[300px] border border-dashed border-white/20 rounded p-1 w-full';
            row2.className = 'flex flex-wrap gap-1 justify-center min-h-[64px] min-w-[300px] border border-dashed border-white/20 rounded p-1 w-full';
            
            row1.dataset.dropTarget = 'rack';

                if (idx < mid) row1.appendChild(tEl);

        function updatePoolCount() {
            els.poolCountText.textContent = gameState.pool ? gameState.pool.length : 0;
        }

        function makeDraggable(element, tileData, fromRack) {
            element.dataset.id = tileData.id;
            element.dataset.source = fromRack ? 'rack' : 'board';
            
            // Store tile data as JSON string for easy access during drag
            element.dataset.tile = JSON.stringify(tileData);

            let isDragging = false;
            let hasMoved = false;
            let startX, startY, initialClientX, initialClientY;
            let longPressTimer = null;
            let initialRect = null;
            
            const startDrag = (e) => {
                if (gameState.currentPlayerId !== currentUser.uid) return;
                
                initialClientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                initialClientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                initialRect = element.getBoundingClientRect();
                
                startX = initialClientX - initialRect.left;
                startY = initialClientY - initialRect.top;
                
                isDragging = true;
                hasMoved = false;
                draggedTile = element;
                
                // Save initial state for reset if this is the first move of the turn
                if (initialRackState.length === 0) {
                    initialRackState = JSON.parse(JSON.stringify(localRack));
                    initialBoardState = JSON.parse(JSON.stringify(gameState.board));
                }

                if (fromRack) {
                    longPressTimer = setTimeout(() => {
                        if (!hasMoved && isDragging) {
                            isDragging = false;
                            draggedTile = null;
                            element.classList.remove('selected');
                            autoRegister(tileData);
                        }
                    }, 500); // 500ms 꾹 누르기
                }
                
                e.preventDefault(); // Prevent scrolling on touch
            };
            
            const doDrag = (e) => {
                if (!isDragging) return;
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                if (!hasMoved) {
                    const dist = Math.hypot(clientX - initialClientX, clientY - initialClientY);
                    if (dist > 5) { // 5px 이상 이동 시 드래그로 판정
                        hasMoved = true;
                        if (longPressTimer) clearTimeout(longPressTimer);
                        
                        // Move element to body so it can be dragged freely over boundaries
                        document.body.appendChild(element);
                        element.style.position = 'absolute';
                        element.style.zIndex = '1000';
                        element.classList.add('selected');
                    }
                }

                if (hasMoved) {
                    element.style.left = `${clientX - startX}px`;
                    element.style.top = `${clientY - startY}px`;
                    
                    // Highlight drop targets
                    document.querySelectorAll('.drop-zone-highlight').forEach(el => el.classList.remove('drop-zone-highlight'));
                    const dropTarget = getDropTarget(clientX, clientY);
                    if (dropTarget) {
                        dropTarget.classList.add('drop-zone-highlight');
                    }
                }
            };
            
            const endDrag = (e) => {
                if (longPressTimer) clearTimeout(longPressTimer);
                if (!isDragging) return;
                isDragging = false;
                draggedTile = null;

                if (hasMoved) {
                    element.classList.remove('selected');
                    document.querySelectorAll('.drop-zone-highlight').forEach(el => el.classList.remove('drop-zone-highlight'));
                    
                    const clientX = e.type.includes('mouse') ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
                    const clientY = e.type.includes('mouse') ? e.clientY : (e.changedTouches ? e.changedTouches[0].clientY : 0);
                    
                    handleDrop(element, clientX, clientY, tileData, element.dataset.source);
                }
            };

            element.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', endDrag);
            
            element.addEventListener('touchstart', startDrag, {passive: false});
            document.addEventListener('touchmove', doDrag, {passive: false});
            document.addEventListener('touchend', endDrag);
        }

        function autoRegister(tileData) {
            if (gameState.currentPlayerId !== currentUser.uid) return;
            
            let rack = [...localRack];
            let bestMeld = [];

            if (!tileData.isJoker) {
                // 1. Group (같은 숫자, 다른 색상) 찾기
                let groupMeld = [tileData];
                let usedColors = new Set([tileData.color]);
                let availableJokers = rack.filter(t => t.isJoker && t.id !== tileData.id);
                
                for (let t of rack) {
                    if (t.id === tileData.id) continue;
                    if (!t.isJoker && t.number === tileData.number && !usedColors.has(t.color)) {
                        groupMeld.push(t);
                        usedColors.add(t.color);
                    }
                }
                while (groupMeld.length < 3 && availableJokers.length > 0) {
                    groupMeld.push(availableJokers.pop());
                }
                if (groupMeld.length >= 3) {
                    bestMeld = groupMeld;
                }
                
                // 2. Run (같은 색상, 연속된 숫자) 찾기
                let runMeld = [];
                let sameColorTiles = rack.filter(t => (!t.isJoker && t.color === tileData.color) || t.id === tileData.id);
                let allJokers = rack.filter(t => t.isJoker);
                
                let maxRun = [];
                for (let start = Math.max(1, tileData.number - 12); start <= tileData.number; start++) {
                    for (let len = 3; len <= 13; len++) {
                        if (start + len - 1 < tileData.number) continue;
                        if (start + len - 1 > 13) break;
                        
                        let currentRun = [];
                        let tempSameColor = [...sameColorTiles];
                        let tempJokers = [...allJokers];
                        let valid = true;
                        
                        for (let n = start; n < start + len; n++) {
                            let foundIdx = tempSameColor.findIndex(t => !t.isJoker && t.number === n);
                            if (foundIdx !== -1) {
                                currentRun.push(tempSameColor[foundIdx]);
                                tempSameColor.splice(foundIdx, 1);
                            } else if (tempJokers.length > 0) {
                                currentRun.push(tempJokers.pop());
                            } else {
                                valid = false;
                                break;
                            }
                        }
                        
                        if (valid && currentRun.length > maxRun.length && currentRun.some(t => t.id === tileData.id)) {
                            maxRun = currentRun;
                        }
                    }
                }
                
                if (maxRun.length >= 3 && maxRun.length > bestMeld.length) {
                    bestMeld = maxRun;
                }
            }

            if (bestMeld.length >= 3) {
                // 선택된 세트를 보드에 등록
                let meldIds = new Set(bestMeld.map(t => t.id));
                localRack = localRack.filter(t => !meldIds.has(t.id));
                
                bestMeld.sort((a, b) => {
                    if (a.isJoker) return 1;
                    if (b.isJoker) return -1;
                    return a.number - b.number;
                });
                
                gameState.board.push(bestMeld);
                updateGameUI();
                validateEntireBoard();
                
                const statusMsg = document.getElementById('status-msg');
                if (statusMsg) {
                    statusMsg.textContent = "Auto-registered!";
                    statusMsg.className = "font-bold text-lg text-green-300 tracking-wide drop-shadow";
                    setTimeout(updateControls, 1500);
                }
            }
        }

        function getDropTarget(x, y) {
            // Hide dragged element to find what's underneath
            if(draggedTile) draggedTile.style.display = 'none';
            const elUnder = document.elementFromPoint(x, y);
            if(draggedTile) draggedTile.style.display = 'flex';
            
            if (!elUnder) return null;
            
            return elUnder.closest('[data-drop-target]');
        }

        function handleDrop(element, x, y, tileData, source) {
            const target = getDropTarget(x, y);
            
            // Remove from original source data structures
            if (source === 'rack') {
                localRack = localRack.filter(t => t.id !== tileData.id);
            } else if (source === 'board') {
                for (let i = 0; i < gameState.board.length; i++) {
                    gameState.board[i] = gameState.board[i].filter(t => t.id !== tileData.id);
                }
                gameState.board = gameState.board.filter(g => g.length > 0);
            }

            if (target) {
                const targetType = target.dataset.dropTarget;
                
                if (targetType === 'rack') {
                    localRack.push(tileData);
                    element.dataset.source = 'rack';
                } else if (targetType === 'board') {
                    gameState.board.push([tileData]);
                    element.dataset.source = 'board';
                } else if (targetType === 'group') {
                    const gIdx = parseInt(target.dataset.groupId);
                    if (gameState.board[gIdx]) {
                        gameState.board[gIdx].push(tileData);
                        gameState.board[gIdx].sort((a, b) => {
                            if (a.isJoker) return 1;
                            if (b.isJoker) return -1;
                            return a.number - b.number;
                        });
                    }
                    element.dataset.source = 'board';
                }
            } else {
                 localRack.push(tileData);
                 element.dataset.source = 'rack';
            }

            element.remove(); 
            updateGameUI();
        }

        // 루미큐브 규칙 검증 함수 (Group 또는 Run 검사, 조커 포함)
        function isValidSet(group) {
            if (!group || group.length < 3) return false;
            
            const regularTiles = group.filter(t => !t.isJoker);
            const jokersCount = group.length - regularTiles.length;
            
            if (regularTiles.length === 0) return true; // 조커만으로 3장 이상인 경우

            // 1. Group 검사 (같은 숫자, 다른 색상, 최대 4장)
            if (group.length <= 4) {
                const targetNum = regularTiles[0].number;
                const allSameNumber = regularTiles.every(t => t.number === targetNum);
                const colors = new Set(regularTiles.map(t => t.color));
                const allDistinctColors = colors.size === regularTiles.length;
                if (allSameNumber && allDistinctColors) return true;
            }

            // 2. Run 검사 (같은 색상, 1씩 증가하는 연속 숫자, 3~13장)
            const targetColor = regularTiles[0].color;
            const allSameColor = regularTiles.every(t => t.color === targetColor);
            if (allSameColor) {
                const sorted = [...regularTiles].sort((a, b) => a.number - b.number);
                
                // 중복 번호가 있으면 런 불가
                for (let i = 0; i < sorted.length - 1; i++) {
                    if (sorted[i].number === sorted[i + 1].number) return false;
                }
                
                // 빈 구간을 조커로 메울 수 있는지 계산
                let neededJokers = 0;
                for (let i = 0; i < sorted.length - 1; i++) {
                    const gap = (sorted[i + 1].number - sorted[i].number) - 1;
                    neededJokers += gap;
                }
                
                if (neededJokers <= jokersCount) {
                    const minSpan = sorted[sorted.length - 1].number - sorted[0].number + 1;
                    if (minSpan <= 13) return true;
                }
            }

            return false;
        }

        function validateEntireBoard() {
            if (!gameState.board || gameState.board.length === 0) return true;
            for (let i = 0; i < gameState.board.length; i++) {
                if (!isValidSet(gameState.board[i])) {
                    return false;
                }
            }
            return true;
        }

        async function drawTile() {
            if (gameState.currentPlayerId !== currentUser.uid || hasDrawn) return;
            
            if (gameState.pool && gameState.pool.length > 0) {
                // 타일을 움직인 상태에서 드로우 시 원래대로 롤백
                if (initialRackState.length > 0) {
                    localRack = JSON.parse(JSON.stringify(initialRackState));
                    gameState.board = JSON.parse(JSON.stringify(initialBoardState));
                }
                
                const tile = gameState.pool.pop();
                localRack.push(tile);
                hasDrawn = true;
                showToast(`타일을 1장 뽑았습니다. (+${tile.isJoker ? '조커' : tile.number})`);
                await endTurn(true);
            } else {
                showError("더 이상 가져올 타일이 없습니다!");
                await endTurn(true);
            }
        }

        async function handleTurnTimeout() {
            if (gameState.status !== 'playing') return;
            showToast("시간 초과! 턴이 강제로 넘어갑니다.", true);
            
            // 턴 시작 상태로 복구
            if (initialRackState.length > 0) {
                localRack = JSON.parse(JSON.stringify(initialRackState));
                gameState.board = JSON.parse(JSON.stringify(initialBoardState));
            }
            
            // 패널티로 타일 1장 드로우
            if (gameState.pool && gameState.pool.length > 0) {
                const penaltyTile = gameState.pool.pop();
                localRack.push(penaltyTile);
            }
            
            await endTurn(true);
        }

        async function endTurn(forcedPass = false) {
            if (gameState.currentPlayerId !== currentUser.uid) return;

            if (!forcedPass) {
                const placedTilesCount = turnStartingRackCount - localRack.length;
                
                // 타일을 등록하지도 않고 드로우도 안 한 상태
                if (placedTilesCount <= 0 && !hasDrawn) {
                    showError("타일을 등록하거나 우측 '+' 버튼으로 타일을 1장 가져와야 턴을 마칠 수 있습니다.");
                    return;
                }

                // 보드 검증
                if (!validateEntireBoard()) {
                    showError("보드에 규칙에 맞지 않는 타일 조합(3장 미만 또는 잘못된 세트)이 있습니다! 수정하거나 되돌리기를 누르세요.");
                    return;
                }
            }

            // 승리 조건 검사
            if (localRack.length === 0) {
                showToast("축하합니다! 모든 타일을 내려놓아 승리하셨습니다! 🎉");
            }

            // 다음 턴 플레이어 결정
            const playerIds = Object.keys(gameState.players);
            const currIdx = playerIds.indexOf(currentUser.uid);
            const nextIdx = (currIdx + 1) % playerIds.length;
            const nextPlayerId = playerIds[nextIdx];

            const updates = {
                currentPlayerId: nextPlayerId,
                turnStartTime: Date.now(),
                board: JSON.stringify(gameState.board),
                pool: gameState.pool,
                [`players.${currentUser.uid}.rack`]: localRack,
                [`players.${currentUser.uid}.tileCount`]: localRack.length
            };

            // Reset local turn states
            initialRackState = [];
            initialBoardState = [];
            hasDrawn = false;
            turnStartingRackCount = localRack.length;

            if (db && currentRoomId && !currentRoomId.includes('local')) {
                await updateDoc(getRoomRef(currentRoomId), updates);
            } else {
                Object.assign(gameState, updates);
                gameState.board = unpackBoard(updates.board);
                syncGameState(gameState);
                if (nextPlayerId && nextPlayerId.startsWith('bot_')) {
                    setTimeout(() => {
                        if (gameState.currentPlayerId === nextPlayerId) {
                            if (gameState.pool && gameState.pool.length > 0) {
                                gameState.players[nextPlayerId].rack.push(gameState.pool.pop());
                                gameState.players[nextPlayerId].tileCount = gameState.players[nextPlayerId].rack.length;
                            }
                            gameState.currentPlayerId = currentUser.uid;
                            gameState.turnStartTime = Date.now();
                            showToast("AI 플레이어가 타일을 뽑고 턴을 넘겼습니다.");
                            updateGameUI();
                        }
                    }, 1500);
                }
            }
            
            showToast("턴이 종료되었습니다.");
        }

        function resetTurn() {
             if (gameState.currentPlayerId !== currentUser.uid) return;
             if (initialRackState.length > 0) {
                 localRack = JSON.parse(JSON.stringify(initialRackState));
                 gameState.board = JSON.parse(JSON.stringify(initialBoardState));
                 initialRackState = [];
                 initialBoardState = [];
                 updateGameUI();
                 showToast("타일을 턴 시작 상태로 되돌렸습니다.");
             }
        }

        function sortRackByRun() {
            // 789 정렬 (색상별, 번호순)
            localRack.sort((a, b) => {
                if (a.isJoker) return 1;
                if (b.isJoker) return -1;
                if (a.color !== b.color) return a.color.localeCompare(b.color);
                return a.number - b.number;
            });
            renderRack();
        }

        function sortRackByGroup() {
            // 777 정렬 (번호별, 색상순)
            localRack.sort((a, b) => {
                if (a.isJoker) return 1;
                if (b.isJoker) return -1;
                if (a.number !== b.number) return a.number - b.number;
                return a.color.localeCompare(b.color);
            });
            renderRack();
        }

        async function setupChatSync(roomId) {
            if (!db) return;
            const chatRef = getChatRef(roomId);
            const q = query(chatRef, orderBy("timestamp", "asc"));
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        appendMessage(change.doc.data());
                    }
                });
            });
        }
        
        async function sendMessage() {
            const text = els.chatInput.value.trim();
            if (!text || !db || !currentRoomId) return;
            
            els.chatInput.value = '';
            
            try {
                const senderName = (gameState.players && gameState.players[currentUser.uid]?.name) || 
                                   (gameState.spectators && gameState.spectators[currentUser.uid]?.name) || 
                                   "Spectator";
                
                await addDoc(getChatRef(currentRoomId), {
                    text: text,
                    senderId: currentUser.uid,
                    senderName: senderName,
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("Error sending message", e);
            }
        }
        
        function appendMessage(msg) {
            const div = document.createElement('div');
            const isMine = msg.senderId === currentUser.uid;
            div.className = `message ${isMine ? 'mine' : ''}`;
            
            div.innerHTML = `
                <span class="font-bold text-xs ${isMine ? 'text-blue-300' : 'text-yellow-300'}">${msg.senderName}:</span>
                <span class="text-sm">${msg.text}</span>
            `;
            els.chatMessages.appendChild(div);
            els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
        }

        function setupEventListeners() {
            // Lobby
            els.createRoomBtn.addEventListener('click', () => {
                els.createRoomModal.classList.remove('hidden');
                els.createRoomModal.classList.add('flex');
            });
            
            document.getElementById('cancel-create-btn').addEventListener('click', () => {
                els.createRoomModal.classList.add('hidden');
                els.createRoomModal.classList.remove('flex');
            });
            
            document.getElementById('confirm-create-btn').addEventListener('click', createRoom);
            
            // Game UI
            els.startGameBtn.addEventListener('click', () => {
                if (gameState.host === currentUser.uid && Object.keys(gameState.players || {}).length >= 2) {
                    startGame(Object.keys(gameState.players));
                }
            });

            const addBotBtn = document.getElementById('add-bot-btn');
            if (addBotBtn) {
                addBotBtn.addEventListener('click', async () => {
                    const currentPlayers = Object.keys(gameState.players || {});
                    if (currentPlayers.length >= 4) return;
                    const botId = `bot_${Date.now()}`;
                    const botNum = currentPlayers.length + 1;
                    const botData = {
                        name: `AI Bot ${botNum}`,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=rummiBot${botNum}&backgroundColor=b6e3f4`,
                        tileCount: 0,
                        rack: [],
                        score: 0
                    };
                    if (db && currentRoomId && !currentRoomId.includes('local')) {
                        await updateDoc(getRoomRef(currentRoomId), {
                            [`players.${botId}`]: botData
                        });
                    } else {
                        gameState.players[botId] = botData;
                        syncGameState(gameState);
                    }
                    showToast(`AI 플레이어가 참가했습니다!`);
                });
            }
            
            els.drawBtn.addEventListener('click', drawTile);
            els.doneBtn.addEventListener('click', () => endTurn(false));
            if (els.rackDoneBtn) els.rackDoneBtn.addEventListener('click', () => endTurn(false));
            els.resetBtn.addEventListener('click', resetTurn);
            
            if(els.sort789Btn) els.sort789Btn.addEventListener('click', sortRackByRun);
            if(els.sort777Btn) els.sort777Btn.addEventListener('click', sortRackByGroup);
            
            els.leaveBtn.addEventListener('click', async () => {
                if (db && currentRoomId && currentUser) {
                     const roomRef = getRoomRef(currentRoomId);
                     if(unsubscribeRoom) unsubscribeRoom();
                     if(unsubscribeChat) unsubscribeChat();
                }
                showLobby();
                currentRoomId = null;
            });
            
            // Chat
            const toggleChat = () => {
                els.chatPanel.classList.toggle('open');
                if (els.chatPanel.classList.contains('open')) {
                    setTimeout(() => els.chatInput.focus(), 150);
                }
            };
            if (els.chatBtn) els.chatBtn.addEventListener('click', toggleChat);
            if (els.chatQuickBtn) els.chatQuickBtn.addEventListener('click', toggleChat);
            
            els.sendChatBtn.addEventListener('click', sendMessage);
            els.chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            // Timer Loop
            setInterval(() => {
                if (gameState.status === 'playing' && gameState.turnTimer > 0) {
                    const elapsed = Math.floor((Date.now() - (gameState.turnStartTime || Date.now())) / 1000);
                    const remaining = Math.max(0, gameState.turnTimer - elapsed);
                    
                    // UI 숫자 업데이트
                    const activeProfile = document.querySelector('.player-profile.active .timer-text');
                    if (activeProfile) {
                        activeProfile.textContent = remaining;
                    }

                    // 시간 초과 처리
                    if (remaining <= 0) {
                        if (gameState.currentPlayerId === currentUser.uid) {
                            handleTurnTimeout();
                        } else if (gameState.host === currentUser.uid && elapsed >= gameState.turnTimer + 3) {
                            // 플레이어 응답 없음 대비 호스트 폴백 처리
                            const playerIds = Object.keys(gameState.players);
                            const currIdx = playerIds.indexOf(gameState.currentPlayerId);
                            const nextPlayerId = playerIds[(currIdx + 1) % playerIds.length];
                            if (db && currentRoomId && !currentRoomId.includes('local')) {
                                updateDoc(getRoomRef(currentRoomId), {
                                    currentPlayerId: nextPlayerId,
                                    turnStartTime: Date.now()
                                });
                            }
                        }
                    }
                }
            }, 1000);
            
            // Stop scroll bouncing on iOS/Mac
            document.addEventListener('touchmove', function (e) {
                if(e.target.closest('#chat-messages')) return; // Allow scroll in chat
                e.preventDefault();
            }, {passive: false});
        }
        
        function handleRoomClosed() {
            showError("Room was closed.");
            showLobby();
            currentRoomId = null;
        }

        // Add keyframe animation for timer
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        window.onload = init;

    </script>

    <!-- Auth Screen (Hidden, handled automatically for this demo) -->
    <div id="auth-screen" class="hidden h-screen flex-col items-center justify-center">
        <h1 class="text-4xl font-game mb-4">Rummikub</h1>
        <p>Connecting...</p>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="hidden h-screen flex-col max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-game text-blue-300 drop-shadow-md">YURIKUB</h1>
            <div class="flex items-center gap-4">
                <input type="text" id="player-name" class="bg-slate-800 border border-slate-600 rounded px-3 py-1 text-white focus:outline-none focus:border-blue-400" placeholder="Your Name">
            </div>
        </header>

        <div class="mb-8">
            <h2 class="text-xl font-bold mb-4">Choose Avatar</h2>
            <div id="avatar-grid" class="flex flex-wrap gap-4 p-4 bg-slate-800/50 rounded-xl max-h-48 overflow-y-auto">
                <!-- Avatars generated via JS -->
            </div>
        </div>

        <div class="flex justify-between items-end mb-4">
            <h2 class="text-2xl font-bold">Active Rooms</h2>
            <button id="create-room-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-bold shadow-lg transition-transform hover:scale-105">
                <i class="fa-solid fa-plus mr-2"></i>Create Room
            </button>
        </div>

        <div id="room-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pb-10">
            <!-- Rooms listed here -->
        </div>
    </div>

    <!-- Create Room Modal -->
    <div id="create-room-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl w-96 max-w-[90%] shadow-2xl">
            <h2 class="text-2xl font-bold mb-4">Create Game Room</h2>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">Room Name</label>
                <input type="text" id="room-name" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white" placeholder="My Awesome Game">
            </div>
            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-1">Turn Timer</label>
                <select id="timer-select" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                    <option value="15">15 Seconds</option>
                    <option value="30" selected>30 Seconds</option>
                    <option value="60">60 Seconds</option>
                    <option value="0">Unlimited</option>
                </select>
            </div>
            <div class="flex justify-end gap-3">
                <button id="cancel-create-btn" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600">Cancel</button>
                <button id="confirm-create-btn" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500 font-bold">Create & Join</button>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="flex-col">
        <!-- Toast Notification -->
        <div id="game-toast">알림</div>

        <!-- Top Bar -->
        <div class="h-12 bg-black/40 backdrop-blur flex justify-between items-center px-4 z-20">
            <button id="leave-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-left"></i> Leave</button>
            <div class="flex items-center gap-3">
                <div id="status-msg" class="font-bold text-lg text-yellow-400 tracking-wide drop-shadow">Waiting for players...</div>
                <button id="add-bot-btn" class="hidden bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white px-3 py-1 rounded text-sm font-bold shadow flex items-center gap-1">
                    <i class="fa-solid fa-robot"></i> AI 추가
                </button>
                <button id="start-game-btn" class="hidden bg-green-600 hover:bg-green-500 text-white px-4 py-1 rounded font-bold shadow transition-transform hover:scale-105">Start Game</button>
            </div>

            <div class="flex items-center gap-2">
                <button id="chat-btn" class="text-white relative p-2" title="채팅 열기">
                    <i class="fa-solid fa-comment-dots text-xl"></i>
                </button>
            </div>
        </div>

        <div class="flex-1 flex relative overflow-hidden">
            <!-- Left Sidebar (Players) -->
            <div class="w-24 bg-black/20 p-2 pt-6 flex flex-col items-center justify-between overflow-y-auto border-r border-white/10 z-20">
                <div id="players-sidebar" class="flex flex-col items-center w-full">
                    <!-- Player profiles injected here -->
                </div>

                <!-- 레퍼런스 이미지 기반 좌측 하단 채팅 말풍선 버튼 -->
                <button id="chat-quick-btn" title="Open Chat" class="w-11 h-11 mb-2 rounded-full bg-blue-600/80 hover:bg-blue-500 border border-blue-400 text-white flex items-center justify-center shadow-lg transition-transform hover:scale-110 active:scale-95">
                    <i class="fa-solid fa-comment-dots text-lg"></i>
                </button>
            </div>

            <!-- Main Board Area -->
            <div class="flex-1 flex flex-col relative z-10">
                <div id="board-area" class="flex-1 board-area p-4 relative overflow-auto">
                    <!-- Tiles on board -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-5">
                         <h1 class="text-8xl font-game text-white">Rummikub</h1>
                    </div>
                </div>

                <!-- Player Rack Area -->
                <div class="h-48 player-rack flex flex-col items-center justify-end pb-3 relative z-30">
                    <div class="w-full max-w-4xl flex justify-between items-center px-4 mb-1">
                        <button id="reset-btn" class="bg-amber-900/80 hover:bg-amber-800 border border-amber-500 text-amber-200 text-xs px-3 py-1.5 rounded-full shadow hidden flex items-center gap-1.5 transition-all">
                            <i class="fa-solid fa-rotate-left"></i> 되돌리기 (Reset)
                        </button>
                        <button id="rack-done-btn" class="bg-emerald-600 hover:bg-emerald-500 border border-emerald-400 text-white font-bold text-xs px-4 py-1.5 rounded-full shadow-lg hidden flex items-center gap-1.5 transition-transform hover:scale-105 active:scale-95">
                            <i class="fa-solid fa-check"></i> 턴 종료 (완료)
                        </button>
                    </div>
                    
                    <div id="rack-area" class="flex flex-col gap-1 w-full max-w-4xl mx-auto items-center">
                        <!-- Tiles injected here -->
                    </div>
                </div>
            </div>
            
            <!-- Right Sidebar (Controls) -->
            <div class="w-24 bg-black/20 p-2 flex flex-col items-center justify-center gap-4 border-l border-white/10 z-20">
                <!-- Sort Buttons -->
                <div class="flex flex-col w-16 mb-1">
                    <button id="sort-789-btn" class="sort-btn text-white font-bold py-2 rounded-t-2xl border-b border-black/30 transition-transform active:scale-95">
                        789
                    </button>
                    <button id="sort-777-btn" class="sort-btn text-white font-bold py-2 rounded-b-2xl transition-transform active:scale-95">
                        777
                    </button>
                </div>

                <!-- Draw Pile -->
                <button id="draw-btn" class="draw-btn relative group" title="타일 1장 뽑기 (+패스)">
                    <i class="fa-solid fa-plus text-3xl mb-1 group-hover:scale-110 transition-transform text-blue-300"></i>
                    <div class="text-sm font-bold flex items-center gap-1">
                        <i class="fa-solid fa-layer-group text-xs text-gray-400"></i>
                        <span id="pool-count">106</span>
                    </div>
                    <div class="absolute inset-0 border-2 border-blue-400/50 rounded-[30px] shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                </button>

                <!-- Done Button (턴 종료) -->
                <button id="done-btn" class="done-btn relative group" title="타일 등록 완료 및 턴 종료">
                    <i class="fa-solid fa-check text-white text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-[10px] font-bold text-white tracking-tighter mt-0.5">턴 종료</span>
                </button>
            </div>
        </div>

        <!-- Sliding Chat Panel -->
        <div id="chat-panel" class="flex flex-col shadow-2xl">
            <div class="p-3 border-b border-slate-700 font-bold flex justify-between items-center bg-slate-800">
                <span>Room Chat</span>
                <button onclick="document.getElementById('chat-panel').classList.remove('open')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-messages" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2">
                <!-- Messages -->
            </div>
            <div class="p-3 border-t border-slate-700 flex gap-2 bg-slate-800">
                <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white" placeholder="Message...">
                <button id="send-chat-btn" class="bg-blue-600 text-white rounded px-3 py-1 text-sm"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

</body>
